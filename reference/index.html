<title>Hamiz Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column; sticky header with Sales/Ads switch and scrollable tab chips; cards only for data blocks. Hamiz system: orange accent, Inter. */
:root{
  --bg:#f6f3f0; --surface:#ffffff; --surface-2:#f0ebe6; --fg:#1d1916; --muted:#6e655e; --line:#e6dfd8;
  --accent:#f26522; --accent-ink:#ffffff; --accent-soft:#fde6da;
  --good:#1e8f52; --warn:#b97b06; --bad:#cf3f3f; --info:#2f74b5; --idle:#9a918a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131110; --surface:#1d1a18; --surface-2:#262220; --fg:#f2ede8; --muted:#a59b93; --line:#332d29;
  --accent:#ff7a3d; --accent-ink:#1b0e06; --accent-soft:#3a2216;
  --good:#3fbf7a; --warn:#e2a93a; --bad:#ef6a6a; --info:#6aa8e6; --idle:#7d746d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131110; --surface:#1d1a18; --surface-2:#262220; --fg:#f2ede8; --muted:#a59b93; --line:#332d29;
  --accent:#ff7a3d; --accent-ink:#1b0e06; --accent-soft:#3a2216;
  --good:#3fbf7a; --warn:#e2a93a; --bad:#ef6a6a; --info:#6aa8e6; --idle:#7d746d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.live{background:var(--good)} .dot.ex{background:var(--warn)} .dot.off{background:var(--bad)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

main{max-width:760px;margin:0 auto;padding-block:14px 40px;padding-inline:16px;display:grid;gap:14px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--accent-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.banner b{font-weight:700}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{text-transform:none;letter-spacing:0;font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.p-info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.p-idle{background:var(--surface-2);color:var(--muted)}

.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.s-pending{background:var(--idle)} .s-confirmed{background:var(--info)} .s-delivered{background:var(--good)} .s-returned{background:var(--warn)} .s-cancelled{background:var(--bad)}

.gauge{display:grid;gap:6px}
.track{position:relative;height:12px;background:var(--surface-2);border-radius:6px}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.track .band{position:absolute;top:-4px;bottom:-4px;border:2px dashed var(--good);border-radius:6px}
.row2{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.list{display:grid}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.item .share{grid-column:1/-1;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.item .share i{display:block;height:100%;background:var(--accent);opacity:.75}
.more{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;max-width:100%}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form input,.form select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:16px;font-weight:600;color:var(--fg);width:100%;font-variant-numeric:tabular-nums}
.form .src{font-weight:500;color:var(--good)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.scroll{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.ok{color:var(--good);font-weight:700} td.mid{color:var(--warn);font-weight:700} td.no{color:var(--bad);font-weight:700}
.verdict{border-left:4px solid var(--accent);padding:4px 0 4px 12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .u{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-family:var(--font);font-size:10px}
.chart{width:100%;height:auto;display:block}
.ord{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:0}
.ord .a{font-weight:700;font-family:var(--mono);font-size:13px}
.ord .t{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ord .c{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.file input{font-size:13px;max-width:100%}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
</style>

<header class="top">
  <div class="bar">
    <div class="brand"><b>Hamiz <span>Pulse</span></b></div>
    <div class="sync" id="sync"><i class="dot" id="syncDot"></i><span id="syncText">Connecting…</span></div>
    <div class="seg" role="group" aria-label="Section">
      <button id="secSales" aria-pressed="true">Sales</button>
      <button id="secAds" aria-pressed="false">Ads</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Tabs"></nav>
</header>
<main id="main"><div class="empty">Loading the latest Odoo sync…</div></main>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=0)=>n==null||!isFinite(n)?"–":Number(n).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:d});
const da=n=>{if(n==null||!isFinite(n))return"–";const a=Math.abs(n);if(a>=1e6)return fmt(n/1e6,a>=1e7?1:2)+"M DA";if(a>=1e4)return fmt(n/1e3,0)+"k DA";return fmt(n)+" DA"};
const pct=(n,d=1)=>n==null||!isFinite(n)?"–":(n*100).toFixed(d)+"%";
const usd=(n,d=2)=>n==null||!isFinite(n)?"–":"$"+fmt(n,d);
const store={get(k,f){try{const v=localStorage.getItem("hp."+k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem("hp."+k,JSON.stringify(v))}catch(e){}}};

const TABS={sales:[["overview","Overview"],["trend","Trend"],["sellers","Sellers"],["products","Products"],["channels","Channels"],["orders","Orders"]],
            ads:[["budget","CAC budget"],["plan","Scaling plan"],["review","Ad review"]]};
const STAGES=[["pending","Pending"],["confirmed","Confirmed"],["delivered","Delivered"],["returned","Returned"],["cancelled","Cancelled"]];
const STAGE_PILL={pending:"p-idle",confirmed:"p-info",delivered:"p-good",returned:"p-warn",cancelled:"p-bad"};

const S={section:store.get("section","sales"),tab:store.get("tab",{sales:"overview",ads:"budget"}),
  data:{summary:null,sellers:null,products:null,orders:null},dbState:"wait",
  period:store.get("period","last7"),trend:{days:30,metric:"o"},lists:{sellers:{q:"",sort:"gmv",n:25},products:{q:"",sort:"revenue",n:25}},
  orders:{q:"",stage:"all",n:40},
  ads:Object.assign({aov:null,cr:null,dr:null,fx:250,cac:5,basis:"raw",low:200,high:250,cpm:"0.5,1,1.5,2",ctr:"1.5,2.5,4",
    creatives:6,testBudget:18,minSpend:3,scaleStart:20,step:20,calls:500,stock:6000,remit:10,gap:2},store.get("ads",{})),
  review:{meta:store.get("metaCsv",""),orders:store.get("ordersCsv","")}};

/* ---------------- data ---------------- */
function meta(){return S.data.summary&&S.data.summary.meta}
function setSync(){
  const m=meta(),dot=$("#syncDot"),t=$("#syncText");
  if(S.dbState==="none"){dot.className="dot off";t.textContent="Not connected";return}
  if(!m){dot.className="dot";t.textContent="Waiting for first sync";return}
  const at=new Date(m.generated_at),mins=Math.round((Date.now()-at)/6e4);
  const ago=mins<1?"just now":mins<60?mins+" min ago":mins<1440?Math.round(mins/60)+" h ago":Math.round(mins/1440)+" d ago";
  dot.className="dot "+(m.example?"ex":mins>150?"off":"live");
  t.textContent=(m.example?"Example data":"Odoo · "+ago);
}
async function connect(){
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){S.dbState="none";setSync();render();return}
  S.dbState="ok";
  ["summary","sellers","products","orders"].forEach(k=>{
    db.doc("reports/"+k).onSnapshot(snap=>{S.data[k]=snap.exists?snap.data():null;setSync();render()},
      ()=>{S.dbState="none";setSync();render()});
  });
  setSync();
}

/* ---------------- shell ---------------- */
function renderTabs(){
  $("#secSales").setAttribute("aria-pressed",S.section==="sales");
  $("#secAds").setAttribute("aria-pressed",S.section==="ads");
  $("#tabs").innerHTML=TABS[S.section].map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="${S.tab[S.section]===id}">${l}</button>`).join("");
}
function render(){
  renderTabs();
  const t=S.tab[S.section],main=$("#main");
  let h="";
  const m=meta();
  if(S.dbState==="none")h+=`<div class="banner"><b>Live data is not available in this view.</b> Open this page in Claude while signed in to see the Odoo numbers. The ads calculators still work with your own inputs.</div>`;
  else if(m&&m.example)h+=`<div class="banner"><b>Example data.</b> These are made-up orders so you can see every tab. They are replaced by your real Odoo numbers on the first sync.</div>`;
  const fn={overview,trend,sellers:()=>ranked("sellers"),products:()=>ranked("products"),channels,orders,budget,plan,review}[t];
  try{h+=fn()}catch(e){h+=`<section class="card"><p class="hint">This tab could not render: ${esc(e.message)}</p></section>`}
  main.innerHTML=h;
  bind();
}
function need(k){if(!S.data[k])throw new Error(S.dbState==="none"?"no live data in this view":"waiting for the first Odoo sync");return S.data[k]}
function noData(k){return !S.data[k]?`<section class="card"><div class="empty">${S.dbState==="none"?"Live Odoo data shows here when you open the app in Claude.":"Waiting for the first Odoo sync. Data appears automatically."}</div></section>`:null}

/* ---------------- sales: overview ---------------- */
const PERIODS=[["today","Today","yesterday","vs yesterday"],["yesterday","Yesterday",null,null],["last7","7 days","prev7","vs prior 7 days"],["last30","30 days","prev30","vs prior 30 days"]];
function delta(cur,prev,inverse){
  if(prev==null||!prev)return`<span class="d flat">no comparison</span>`;
  const ch=(cur-prev)/Math.abs(prev);if(!isFinite(ch))return"";
  const good=inverse?ch<0:ch>0,cls=Math.abs(ch)<.005?"flat":good?"up":"down";
  return`<span class="d ${cls}">${ch>0?"▲":ch<0?"▼":"■"} ${Math.abs(ch*100).toFixed(1)}%</span>`;
}
function overview(){
  const e=noData("summary");if(e)return e;
  const s=S.data.summary,p=PERIODS.find(x=>x[0]===S.period)||PERIODS[2],k=s.kpis[p[0]],pv=p[2]?s.kpis[p[2]]:null;
  const ppdRate=s.kpis.last7.orders_per_day,low=+S.ads.low,high=+S.ads.high,scaleMax=Math.max(high*1.2,ppdRate*1.1);
  const st=k.stages||{},tot=k.orders||1;
  let h=`<div class="chips" role="group" aria-label="Period">${PERIODS.map(x=>`<button class="chip" data-period="${x[0]}" aria-pressed="${x[0]===p[0]}">${x[1]}</button>`).join("")}</div>`;
  h+=`<div class="kpis">
    ${kpi("Orders",fmt(k.orders),pv&&delta(k.orders,pv.orders))}
    ${kpi("GMV",da(k.gmv),pv&&delta(k.gmv,pv.gmv))}
    ${kpi("Avg order value",da(k.aov),pv&&delta(k.aov,pv.aov))}
    ${kpi("Cancel rate",pct(k.cancel_rate),pv&&delta(k.cancel_rate,pv.cancel_rate,true))}
    ${kpi("Net GMV (excl. cancelled)",da(k.net_gmv),pv&&delta(k.net_gmv,pv.net_gmv))}
    ${kpi("Orders per day",fmt(k.orders_per_day,1),pv&&delta(k.orders_per_day,pv.orders_per_day))}
  </div>`;
  if(pv)h+=`<p class="hint" style="margin-top:-4px">Changes are ${p[3]}.</p>`;
  h+=`<section class="card"><h2>Daily orders goal <small>${low}–${high} placed/day</small></h2>
    <div class="gauge"><div class="row2"><span><span class="big">${fmt(ppdRate,1)}</span> / day, last 7 days</span><span class="pill ${ppdRate>=low?"p-good":ppdRate>=low*.6?"p-warn":"p-bad"}">${ppdRate>=low?"On target":fmt(low-ppdRate,0)+" short"}</span></div>
    <div class="track"><i class="fill" style="width:${Math.min(100,ppdRate/scaleMax*100)}%"></i><i class="band" style="left:${low/scaleMax*100}%;width:${(high-low)/scaleMax*100}%"></i></div>
    <div class="row2"><span>0</span><span>Target band ${low}–${high}</span><span>${fmt(scaleMax,0)}</span></div></div></section>`;
  h+=`<section class="card"><h2>Order status <small>${fmt(k.orders)} orders</small></h2>
    <div class="stack">${STAGES.map(([id])=>`<i class="s-${id}" style="width:${(st[id]||0)/tot*100}%"></i>`).join("")}</div>
    <div class="legend">${STAGES.map(([id,l])=>`<span><i class="s-${id}"></i>${l} <b class="num">${fmt(st[id]||0)}</b></span>`).join("")}</div>
    <div class="stats">
      <div class="stat"><div class="l">Confirmed</div><div class="v">${pct(k.confirm_rate,0)}</div><div class="u">of resolved orders</div></div>
      <div class="stat"><div class="l">Delivered</div><div class="v">${pct(k.delivery_rate,0)}</div><div class="u">of shipped parcels</div></div>
      <div class="stat"><div class="l">Lost value</div><div class="v">${pct(k.cancel_rate_value,0)}</div><div class="u">GMV cancelled</div></div>
    </div></section>`;
  h+=`<section class="card"><h2>When orders arrive <small>last 30 days, Algiers time</small></h2>${hourChart(s.hours)}<p class="hint">Use the peak hours to plan ad budget and confirmation-call shifts.</p></section>`;
  return h;
}
function kpi(l,v,d){return`<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span>${d||'<span class="d flat">&nbsp;</span>'}</div>`}
function hourChart(hours){
  const W=340,H=120,max=Math.max(1,...hours),bw=W/24;
  let b="";hours.forEach((v,i)=>{const h=v/max*(H-22);b+=`<rect x="${i*bw+1.5}" y="${H-16-h}" width="${bw-3}" height="${h}" rx="2" fill="var(--accent)" opacity="${v===max?1:.55}"><title>${i}:00 · ${v} orders</title></rect>`});
  [0,6,12,18,23].forEach(i=>b+=`<text x="${i*bw+bw/2}" y="${H-3}" text-anchor="middle">${i}h</text>`);
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Orders by hour">${b}</svg>`;
}

/* ---------------- sales: trend ---------------- */
function trend(){
  const e=noData("summary");if(e)return e;
  const s=S.data.summary,days=s.daily.slice(-S.trend.days),M=S.trend.metric;
  const W=360,H=190,pad=34,cw=W-pad-6,ch=H-38,bw=cw/days.length;
  const val=d=>M==="o"?d.o:d.g,cval=d=>M==="o"?d.c:d.cg;
  const max=Math.max(1,...days.map(val)),nice=niceMax(max);
  let g="";
  [0,.5,1].forEach(f=>{const y=10+ch-ch*f;g+=`<line x1="${pad}" x2="${W-6}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad-5}" y="${y+3}" text-anchor="end">${M==="o"?fmt(nice*f):da(nice*f).replace(" DA","")}</text>`});
  days.forEach((d,i)=>{const v=val(d),c=cval(d),hv=v/nice*ch,hc=c/nice*ch,x=pad+i*bw;

/* ---------------- ads review ---------------- */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===","||ch===";"||ch==="\t"){row.push(f);f=""}
    else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(ch!=="\r")f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  const hdr=(rows.shift()||[]).map(h=>h.trim().toLowerCase().replace(/^﻿/,""));
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]||"").trim()])));
}
const col=(row,names)=>{for(const n of names){const k=Object.keys(row).find(k=>k===n||k.includes(n));if(k!=null&&row[k]!=="")return row[k]}return""};

      const g=groups[n]=groups[n]||{raw:0,pending:0,conf:0,val:[],deliv:0};g.raw++;if(st.includes("pend"))g.pending++;
      if(/confirm|deliver|return|ship/.test(st)){g.conf++;const v=num(col(r,["value","total"]));if(v)g.val.push(v)}if(st.includes("deliver"))g.deliv++})}
  else if(S.data.summary){const utm=S.data.summary.utm||[];Object.keys(spend).forEach(n=>{const m=utm.filter(u=>u.name.toLowerCase().includes(n.toLowerCase())||n.toLowerCase().includes((u.name.split(" / ").pop()||"").toLowerCase()));
      if(m.length){const g=groups[n]={raw:0,pending:0,conf:0,val:[],deliv:0,approx:true};m.forEach(u=>{g.raw+=u.orders;g.conf+=u.confirmed;g.deliv+=u.delivered;g.val.push(u.gmv/u.orders)})}})}

    const n3=I.basis==="raw"?g.raw:g.conf;let d,cls;
    if(n==="UNATTRIBUTED"){d="Fix tracking: orders without an ad name";cls="p-info"}
    else if(g.raw&&g.pending/g.raw>.5){d="Wait: most orders still pending";cls="p-idle"}
    else if(resolved>=10&&rate<.5){d=`Kill: ${pct(rate,0)} confirmed, junk orders`;cls="p-bad"}
    else if(n3>=3&&g.conf>=2&&cac<=I.cac){d="Promote: under the cap";cls="p-good"}
    else if(n3>=3&&cac>1.5*I.cac&&sp>=2.5*capRaw){d=`Kill: CAC ${pct(cac)} of order value`;cls="p-bad"}
    else if(!g.raw&&sp>=2.5*capRaw){d="Kill: no orders after 2.5× the allowed cost";cls="p-bad"}
    else{d="Wait: not enough data";cls="p-idle"}
    return{n,sp,g,aov,rate,cac,d,cls}}).sort((a,b)=>a.cac-b.cac);
  const spAll=rows.reduce((a,r)=>a+r.sp,0),rawAll=rows.reduce((a,r)=>a+r.g.raw,0),confAll=rows.reduce((a,r)=>a+r.g.conf,0);
  const avg=rows.some(r=>r.g.val.length)?rows.reduce((a,r)=>a+r.g.val.reduce((x,y)=>x+y,0),0)/rows.reduce((a,r)=>a+r.g.val.length,0):I.aov;
  const blended=I.basis==="raw"?(rawAll?spAll*I.fx/rawAll/avg:Infinity):(confAll?spAll*I.fx/(confAll/basisMult(I.basis,I.c,I.d))/avg:Infinity);
  h+=`<section class="card"><h2>Account today</h2><div class="stats">
    <div class="stat"><div class="l">Spend</div><div class="v">${usd(spAll,0)}</div><div class="u">${da(spAll*I.fx)}</div></div>
    <div class="stat"><div class="l">Orders</div><div class="v">${fmt(rawAll)}</div><div class="u">${fmt(confAll)} confirmed</div></div>
    <div class="stat"><div class="l">CAC</div><div class="v" style="color:var(${blended<=I.cac?"--good":"--bad"})">${pct(blended)}</div><div class="u">cap ${pct(I.cac,0)} per ${LBL[I.basis]}</div></div></div>
    ${confAll?`<p class="hint">Projected cost per delivered order: ${pct(spAll*I.fx/(confAll*I.d)/avg)} of order value.</p>`:""}</section>`;
  h+=`<section class="card"><h2>Ads <small>best CAC first</small></h2><div class="list">${rows.map(r=>`<div class="item"><span class="n">${esc(r.n)}</span><span class="r">${isFinite(r.cac)?pct(r.cac):"–"}</span>
    <span class="s">${usd(r.sp)} · ${fmt(r.g.raw)} placed · ${fmt(r.g.conf)} conf (${pct(r.rate,0)}) · AOV ${da(r.aov)}${r.g.approx?" · matched by campaign":""}</span><span></span>
    <span class="s" style="grid-column:1/-1"><span class="pill ${r.cls}">${esc(r.d)}</span></span></div>`).join("")}</div>
    <p class="hint">The review can't see how long each ad has run. Don't kill anything before 3 full days unless it's clearly broken.</p></section>`;
  return h;
}

/* ---------------- events ---------------- */
function bind(){
  document.querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>{S.period=b.dataset.period;store.set("period",S.period);render()});
  document.querySelectorAll("[data-tdays]").forEach(b=>b.onclick=()=>{S.trend.days=+b.dataset.tdays;render()});
  document.querySelectorAll("[data-tmetric]").forEach(b=>b.onclick=()=>{S.trend.metric=b.dataset.tmetric;render()});
  document.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>{S.orders.stage=b.dataset.stage;S.orders.n=40;render()});
  document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{const k=b.dataset.more;if(k==="orders")S.orders.n+=40;else S.lists[k].n+=25;render()});
  document.querySelectorAll("[data-gap]").forEach(b=>b.onclick=()=>{S.ads.gap=+b.dataset.gap;saveAds();render()});
  ["sellers","products"].forEach(k=>{const q=$("#q_"+k),s=$("#s_"+k);
    if(q)q.oninput=()=>{S.lists[k].q=q.value;S.lists[k].n=25;rerenderKeep("q_"+k)};
    if(s)s.onchange=()=>{S.lists[k].sort=s.value;render()}});
  const qo=$("#q_orders");if(qo)qo.oninput=()=>{S.orders.q=qo.value;S.orders.n=40;rerenderKeep("q_orders")};
  document.querySelectorAll("[data-ads]").forEach(el=>el.onchange=()=>{const k=el.dataset.ads;S.ads[k]=el.tagName==="SELECT"||k==="cpm"||k==="ctr"?el.value:(el.value===""?null:el.value);saveAds();rerenderKeep(null)});
  const r=$("[data-reset]");if(r)r.onclick=()=>{S.ads.aov=S.ads.cr=S.ads.dr=null;saveAds();render()};
  const fm=$("#fMeta"),fo=$("#fOrd");
  if(fm)fm.onchange=()=>readFile(fm,"meta");if(fo)fo.onchange=()=>readFile(fo,"orders");
  const cl=$("[data-clear]");if(cl)cl.onclick=()=>{S.review={meta:"",orders:""};store.set("metaCsv","");store.set("ordersCsv","");render()};
}
function readFile(input,key){const f=input.files&&input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{S.review[key]=String(rd.result);store.set(key==="meta"?"metaCsv":"ordersCsv",S.review[key].length<400000?S.review[key]:"");render()};rd.readAsText(f)}
function saveAds(){const {aov,cr,dr,fx,cac,basis,low,high,cpm,ctr,creatives,testBudget,minSpend,scaleStart,step,calls,stock,remit,gap}=S.ads;store.set("ads",{aov,cr,dr,fx,cac,basis,low,high,cpm,ctr,creatives,testBudget,minSpend,scaleStart,step,calls,stock,remit,gap})}
function rerenderKeep(id){const y=window.scrollY,el=id&&$("#"+id),pos=el?el.selectionStart:null;render();if(id){const n=$("#"+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}window.scrollTo(0,y)}

$("#secSales").onclick=()=>{S.section="sales";store.set("section","sales");render();window.scrollTo(0,0)};
$("#secAds").onclick=()=>{S.section="ads";store.set("section","ads");render();window.scrollTo(0,0)};
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab[S.section]=b.dataset.tab;store.set("tab",S.tab);render();window.scrollTo(0,0)};
setInterval(setSync,60000);
render();connect();
})();
</script>
