# Render blueprint: web app + hourly sync cron + Postgres. Secrets are set in the Render dashboard (sync: false).
databases:
  - name: hamiz-pulse-db
    plan: basic-256mb

envVarGroups:
  - name: hamiz-pulse-secrets
    envVars:
      - {key: ODOO_URL, value: https://erp.hamizonline.com}
      - {key: ODOO_DB, sync: false}
      - {key: ODOO_USER, sync: false}
      - {key: ODOO_KEY, sync: false}
      - {key: META_ACCESS_TOKEN, sync: false}
      - {key: META_AD_ACCOUNT_ID, sync: false}
      - {key: APP_ALLOWED_EMAILS, sync: false}
      - {key: APP_SECRET_KEY, generateValue: true}

services:
  - type: web
    name: hamiz-pulse
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - fromGroup: hamiz-pulse-secrets
      - {key: DATABASE_URL, fromDatabase: {name: hamiz-pulse-db, property: connectionString}}
      - {key: PULSE_FORCE_HTTPS, value: "1"}
      - {key: APP_BASE_URL, sync: false}
      - {key: SMTP_HOST, sync: false}
      - {key: SMTP_USER, sync: false}
      - {key: SMTP_PASSWORD, sync: false}
      - {key: SMTP_FROM, sync: false}

  - type: cron
    name: hamiz-pulse-sync
    runtime: docker
    schedule: "7 * * * *"   # hourly, off the top of the hour
    dockerCommand: python -m pulse.sync
    envVars:
      - fromGroup: hamiz-pulse-secrets
      - {key: DATABASE_URL, fromDatabase: {name: hamiz-pulse-db, property: connectionString}}
